steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', '-t', 
      'gcr.io/$PROJECT_ID/nagarvaani:$COMMIT_SHA', '.'
    ]
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push', 
      'gcr.io/$PROJECT_ID/nagarvaani:$COMMIT_SHA'
    ]
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'nagarvaani',
      '--image', 'gcr.io/$PROJECT_ID/nagarvaani:$COMMIT_SHA',
      '--region', 'asia-south1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--memory', '512Mi',
      '--cpu', '1',
      '--min-instances', '1',
      '--max-instances', '10',
      '--set-env-vars', 
      'NODE_ENV=production,APP_URL=https://nagarvaani-HASH-el.a.run.app'
    ]

images:
  - 'gcr.io/$PROJECT_ID/nagarvaani:$COMMIT_SHA'
