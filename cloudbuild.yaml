steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/nagarvaani:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/nagarvaani:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/nagarvaani:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/nagarvaani:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nagarvaani'
      - '--image'
      - 'gcr.io/$PROJECT_ID/nagarvaani:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      # max-instances=1: in-memory idempotency LRU and demo sandbox are per-instance.
      # A single instance handles the demo load; raise this when switching to live mode.
      - '1'
      - '--set-env-vars'
      - 'NODE_ENV=production,APP_MODE=demo'
      - '--set-secrets'
      # Demo deploy: only GEMINI_API_KEY is required. Gemini fallback to rule-based
      # classifier if the key exhausts quota. No Firebase Admin, no session secret.
      - 'GEMINI_API_KEY=GEMINI_API_KEY:latest'

  # After deploy: capture the service URL, update APP_URL, verify health + readiness.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        SERVICE_URL="$$(gcloud run services describe nagarvaani \
          --region=asia-south1 \
          --format='value(status.url)')"
        echo "Deployed to: $${SERVICE_URL}"
        gcloud run services update nagarvaani \
          --region=asia-south1 \
          --update-env-vars="APP_URL=$${SERVICE_URL}"
        # Wait up to 90 s for health endpoint
        for i in $$(seq 1 30); do
          if curl --fail --silent --max-time 5 "$${SERVICE_URL}/api/health" > /dev/null; then
            echo "/api/health OK"
            break
          fi
          echo "Waiting for health ($${i}/30)..."
          sleep 3
        done
        curl --fail --silent --show-error "$${SERVICE_URL}/api/health"
        curl --fail --silent --show-error "$${SERVICE_URL}/api/ready"

images:
  - 'gcr.io/$PROJECT_ID/nagarvaani:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/nagarvaani:latest'

options:
  logging: CLOUD_LOGGING_ONLY
